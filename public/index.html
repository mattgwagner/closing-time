<body>
<div id="stage">

    <button class="ctl door" id="bDoorL">DOOR<small>Q</small></button>

  </div>
</div>

<script>
"use strict";
// ======================================================================================
// Game rules. Pure logic (no DOM) so e2e/bot.mjs can simulate whole nights at high speed.
// ======================================================================================
const HOUR = 45;                       // real seconds per in-game hour; a night is 12 AM → 6 AM
const NIGHT_LEN = HOUR * 6;
const DRAIN = 0.085;                   // power % per second, per unit of usage
const NIGHTS = [null, [3,0,0,0], [5,3,0,2], [7,5,4,5], [9,8,7,8], [11,10,10,10]]; // Bopper, Pippa, Rattles, Zoom
const WHO = ["bop", "pip", "rat", "zoom"];
const NAMES = { bop: "Bopper", pip: "Pippa", rat: "Rattles", zoom: "Zoom", power: "Bopper" };
const BOP_PATH = ["stage", "snack", "rental", "lhall", "ldoor"];
const BOP_CAM = { stage: 1, snack: 3, rental: 7, lhall: 5 };
const PIP_PATH = ["rink", "rail", "party", "window"];
const PIP_CAM = { rink: 2, rail: 2, party: 8 };

// Chapter 2, Starlite Cinema: Bopper (back, same left door), Gulp, Hue, Lumi. Bopper walks the same camera numbers.
const DRAIN2 = [0.2, 0.13, 0.15, 0.17, 0.21, 0.21, 0.2]; // power drain by night (6 = Custom): the cinema eats power faster as the week goes on
const NIGHTS2 = [null, [3,0,0,0], [5,3,3,0], [7,5,5,4], [9,8,8,8], [11,10,10,10]]; // Bopper, Gulp, Hue, Lumi
const GULP_CAM = [4, 2, 6];            // Popcorn Machine → Lobby → the Aisle → your popcorn chute
const HUE_CAM = [8, 2];                // Poster Hall → Lobby → your window
const gulpWait = a => Math.max(2.6, 4.5 - a * 0.08); // seconds Gulp chomps at the chute before he climbs in
const hueWait = a => Math.max(4.5, 9 - a * 0.2);     // seconds Hue waits at the window for her colour
const lumiWait = a => Math.max(4.5, 9 - a * 0.2);    // seconds Lumi circles the projector
const LUMI_DARK = 2;                                 // seconds of dark (projector, light and tablet off) to send Lumi off

function newNight(night, ai, ch = 1) {
  return {
    ch, night, ai: ai.slice(), t: 0, power: 100,
    doorL: false, doorR: false, lightL: false, lightR: false, winLight: false, hatch: false, cams: false, cam: 1, lamp: true,
    bop: { i: 0, clock: 0, doorT: 0 },
    pip: { i: 0, clock: 0, winT: 0, push: 0 },
    rat: { i: 0, clock: 0, nearT: 0 },
    zoom: { st: 0, clock: 0, runT: 0, lock: 0 },
    gulp: { i: 0, clock: 0, chuteT: 0 },
    hue: { i: 0, clock: 0, winT: 0, col: 0 },
    lumi: { i: 0, clock: 0, lampT: 0, darkT: 0 },
    out: null, over: null, won: false, glitch: 0, bangs: 0, events: [],
  };
}
function usage(S) {
  if (S.ch === 2) return 1 + S.doorL + S.lightL + S.cams;
  return 1 + S.doorL + S.doorR + (S.lightL || S.lightR) + S.winLight + S.hatch + S.cams;
}
const bopWait = a => Math.max(4.5, 9 - a * 0.2);    // seconds Bopper waits at the left door
const pipWait = a => Math.max(3.5, 8 - a * 0.2);   // seconds Pippa waits at the window
const ratWait = a => Math.max(3.5, 8 - a * 0.2);   // seconds Rattles waits at the vent
const zoomRun = a => Math.max(3.2, 5 - a * 0.1);   // seconds Zoom takes down the East Hall
function lose(S, who) { S.over = who; S.cams = false; S.events.push("scare"); }
function glitch(S, a, b) { if (S.cams && (S.cam === a || S.cam === b)) { S.glitch = 0.9; S.events.push("glitch"); } }

// Bopper walks a path to the left door, then waits. A shut door sends him back to the snack bar. Same in both chapters.
// Returns true when he got you.
function bopStep(S, dt, rnd) {
  const b = S.bop, a = S.ai[0];
  if (a <= 0) return false;
  if (b.i < 4) {
    b.clock += dt;
    if (b.clock >= 4.9) {
      b.clock -= 4.9;
      if (rnd() * 20 < a) {
        const from = BOP_CAM[BOP_PATH[b.i]];
        b.i++;
        S.events.push(b.i >= 3 ? "step-near" : "step");
        glitch(S, from, BOP_CAM[BOP_PATH[b.i]]);
        if (b.i === 4) b.doorT = 0;
      }
    }
  } else {
    b.doorT += dt;
    if (b.doorT >= bopWait(a)) {
      if (S.doorL) { b.i = 1; b.clock = 0; S.events.push("bop-leave"); }
      else { lose(S, "bop"); return true; }
    }
  }
  return false;
}

// Chapter 2's three new ones. Each has its own move, and none of them is a door.
function step2(S, dt, rnd) {
  const ai = S.ai;
  // Gulp waddles Popcorn Machine → Lobby → the Aisle → the popcorn chute. Popcorn sends him back (see feed()).
  const g = S.gulp;
  if (ai[1] > 0) {
    if (g.i < 3) {
      g.clock += dt;
      if (g.clock >= 5.1) {
        g.clock -= 5.1;
        if (rnd() * 20 < ai[1]) {
          const from = GULP_CAM[g.i];
          g.i++;
          S.events.push("gulp" + g.i);
          glitch(S, from, GULP_CAM[g.i] || from);
          if (g.i === 3) g.chuteT = 0;
        }
      }
    } else {
      g.chuteT += dt;
      if (g.chuteT >= gulpWait(ai[1])) return lose(S, "gulp");
    }
  }
  // Hue sneaks Poster Hall → Lobby → the window, glowing red, green or blue. The matching button sends her back.
  const h = S.hue;
  if (ai[2] > 0) {
    if (h.i < 2) {
      h.clock += dt;
      if (h.clock >= 4.7) {
        h.clock -= 4.7;
        if (rnd() * 20 < ai[2]) {
          const from = HUE_CAM[h.i];
          h.i++;
          glitch(S, from, HUE_CAM[h.i] || from);
          if (h.i === 2) { h.winT = 0; h.col = Math.floor(rnd() * 3); S.events.push("hue-window"); }
          else S.events.push("hue-move");
        }
      }
    } else {
      h.winT += dt;
      if (h.winT >= hueWait(ai[2])) return lose(S, "hue");
    }
  }
  // Lumi flutters down from the rafters to the projector. Lights and the tablet pull her in faster.
  // At the projector she only leaves after LUMI_DARK seconds with the projector, the hall light and the tablet all off.
  const l = S.lumi;
  if (ai[3] > 0) {
    if (l.i < 2) {
      l.clock += dt * (S.cams || S.lightL ? 1.6 : 0.7);
      if (l.clock >= 5.2) {
        l.clock -= 5.2;
        if (rnd() * 20 < ai[3]) {
          l.i++;
          glitch(S, 9, 9);
          if (l.i === 2) { l.lampT = 0; l.darkT = 0; S.events.push("lumi-lamp"); }
          else S.events.push("lumi-move");
        }
      }
    } else {
      l.lampT += dt;
      l.darkT = !S.lamp && !S.cams && !S.lightL ? l.darkT + dt : 0;
      if (l.darkT >= LUMI_DARK) { l.i = 0; l.clock = 0; S.events.push("lumi-leave"); }
      else if (l.lampT >= lumiWait(ai[3])) return lose(S, "lumi");
    }
  }
}
// Tossing popcorn sends Gulp back to the machine if he's on the Aisle or at the chute. Otherwise it's wasted power.
function feed(S) {
  if (S.gulp.i >= 2) { S.gulp.i = 0; S.gulp.clock = 0; S.events.push("gulp-leave"); }
  else { S.power = Math.max(0.5, S.power - 2); S.events.push("popcorn-waste"); }
}
// Picking Hue's colour: the right one sends her back, a wrong one makes her come at you sooner.
function paint(S, k) {
  const h = S.hue;
  if (h.i !== 2) return;
  if (k === h.col) { h.i = 0; h.clock = 0; S.events.push("hue-leave"); }
  else { h.winT += 2.5; S.events.push("hue-wrong"); }
}

function step(S, dt, rnd) {
  if (S.over || S.won) return;
  S.t += dt;
  S.glitch = Math.max(0, S.glitch - dt);
  if (S.t >= NIGHT_LEN) { S.won = true; S.events.push("6am"); return; }
  if (S.out) {
    S.out.t += dt;
    if (S.out.t >= S.out.kill) lose(S, "power");
    return;
  }
  S.power -= dt * (S.ch === 2 ? DRAIN2[S.night] : DRAIN) * usage(S);
  if (S.power <= 0) {
    S.power = 0;
    S.out = { t: 0, kill: 7 + rnd() * 12 };
    S.doorL = S.doorR = S.lightL = S.lightR = S.winLight = S.hatch = S.cams = S.lamp = false;
    S.events.push("powerout");
    return;
  }
  if (bopStep(S, dt, rnd)) return;
  if (S.ch === 2) return step2(S, dt, rnd);
  const ai = S.ai, watching = c => S.cams && S.cam === c;

  // Pippa only moves while her camera isn't being watched. At the window, light her up to send her back.
  const p = S.pip;
  if (ai[1] > 0) {
    if (p.i < 3) {
      const c = PIP_CAM[PIP_PATH[p.i]];
      if (!watching(c)) {
        p.clock += dt;
        if (p.clock >= 4.5) {
          p.clock -= 4.5;
          if (rnd() * 20 < ai[1]) {
            p.i++;
            S.events.push(p.i === 3 ? "pip-window" : "pip-move");
            glitch(S, c, PIP_CAM[PIP_PATH[p.i]]);
            if (p.i === 3) { p.winT = 0; p.push = 0; }
          }
        }
      }
    } else {
      p.winT += dt;
      if (S.winLight) {
        p.push += dt;
        if (p.push >= 2.2) { p.i = 0; p.clock = 0; S.events.push("pip-leave"); }
      } else if (p.winT >= pipWait(ai[1])) return lose(S, "pip");
    }
  }

  // Rattles crawls the vent: far → middle → at the grate. The hatch has to be shut when he gets there.
  const r = S.rat;
  if (ai[2] > 0) {
    if (r.i < 2) {
      r.clock += dt;
      if (r.clock >= 5.3) {
        r.clock -= 5.3;
        if (rnd() * 20 < ai[2]) {
          r.i++;
          S.events.push("rattle" + r.i);
          glitch(S, 9, 9);
          if (r.i === 2) r.nearT = 0;
        }
      }
    } else {
      r.nearT += dt;
      if (r.nearT >= ratWait(ai[2])) {
        if (S.hatch) { r.i = 0; r.clock = 0; S.events.push("rat-leave"); }
        else return lose(S, "rat");
      }
    }
  }

  // Zoom creeps out from behind the pit garage door when Cam 4 is ignored (watching it holds him a moment), then races the East Hall.
  const z = S.zoom;
  if (ai[3] > 0) {
    if (z.st < 3) {
      if (watching(4)) z.lock = 1.5 + rnd() * 2;
      else if (z.lock > 0) z.lock -= dt;
      else {
        z.clock += dt;
        if (z.clock >= 5) {
          z.clock -= 5;
          if (rnd() * 20 < ai[3]) {
            z.st++;
            S.events.push("zoom" + z.st);
            if (z.st === 3) { z.runT = 0; S.events.push("zoom-run"); glitch(S, 4, 6); }
          }
        }
      }
    } else {
      z.runT += dt;
      if (z.runT >= zoomRun(ai[3])) {
        if (S.doorR) {
          S.power = Math.max(0.5, S.power - 4);
          S.bangs++;
          z.st = rnd() < 0.5 ? 0 : 1; z.clock = 0; z.runT = 0;
          S.events.push("bang");
        } else return lose(S, "zoom");
      }
    }
  }
}

// Seeded random (mulberry32) for repeatable sims and ?seed= runs.
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// Bot players for balance checks. "good" reacts to what a careful player can see or hear, with human reaction delays.
const POLICIES = {
  idle() {},
  good(S, m, dt, rnd) {
    const office = () => { if (S.cams) { S.cams = false; m.look = 0; } };
    const later = (k, lo, hi) => (m[k] ??= lo + rnd() * (hi - lo)) - dt <= 0 ? (m[k] = null, true) : (m[k] -= dt, false);
    // left light peeks every few seconds; a peek takes 0.5 s
    if (m.peek > 0) { m.peek -= dt; office(); S.lightL = true; if (m.peek <= 0) S.lightL = false; }
    else if (!S.cams && (later("lc", 2.5, 5) || (m.heard && later("hd", 0.4, 1.5)))) { m.peek = 0.5; m.heard = false; m.lc = null; if (S.bop.i === 4) m.seenBop = true; }
    if (S.bop.i === 4 && m.bopWas !== 4) m.heard = true; // footsteps on the left
    m.bopWas = S.bop.i;
    if (m.seenBop && !S.doorL && later("cl", 0.3, 1)) { office(); S.doorL = true; m.seenBop = false; }

const ALL_CTL = ["bDoorL", "bDoorR", "bLightL", "bLightR", "bWin", "bVent", "bFeed", "bLamp", "bHue0", "bHue1", "bHue2"];

function show(id) { for (const s of ["title", "how", "custom", "hud", "pause", "over", "won"]) $(s).hidden = !id.includes(s); }
let capTimer = 0;
function caption(s, ms = 2600) { const c = $("cap"); c.textContent = s; c.style.opacity = 1; clearTimeout(capTimer); capTimer = setTimeout(() => (c.style.opacity = 0), ms); }

function refreshTitle() {
  save = loadSave();
  const P = prog(), C = CH[G.ch];
  $("tSub").textContent = C.sub;
  $("bCh1").classList.toggle("on", G.ch === 1); $("bCh2").classList.toggle("on", G.ch === 2);
  $("bCont").textContent = P.beat ? `Night ${P.night}` : (P.night > 1 ? `Continue: Night ${P.night}` : "Start: Night 1");
  $("bNew").hidden = P.night <= 1 && !P.beat; $("bNew").textContent = "New game";
  $("bSoft").textContent = `Less scary: ${save.soft ? "ON" : "OFF"}`;
  $("bSoft").classList.toggle("on", save.soft);
  $("stars").textContent = [P.beat && "★ Survived the week", P.custom && "★ Custom Night", P.max && "★ All 20s"].filter(Boolean).join("   ");
}
function toTitle() { G.mode = "title"; G.S = null; show(["title"]); refreshTitle(); }
function pickChapter(n) { if (G.ch === n) return; G.ch = n; newArmed = 0; save.ch = n; storeSave(); refreshTitle(); }

function startNight(n, ai, custom = false) {
  audio();
  const C = CH[G.ch];
  G.custom = custom; G.S = newNight(n, ai || C.NIGHTS[n], G.ch); G.mode = "play"; G.introT = 0; G.nextClank = 0; mbStep = 0; mbNext = 0;
  anim.doorL = anim.doorR = anim.hatch = 0;
  for (const b of $("camMap").querySelectorAll("button")) b.textContent = `${b.dataset.cam} ${C.CAM_NAMES[b.dataset.cam]}`;
  show(["hud"]); syncControls();
  $("msg").hidden = true;
  const key = G.ch + ":" + n;
  if (!custom && C.CALLS[n] && !G.heard.has(key)) { // the call plays once per night; retries skip it
    SFX.ring();
    const S0 = G.S, tryCall = () => {
      if (G.S !== S0 || S0.over || S0.won) return;
      if (G.mode !== "play") return setTimeout(tryCall, 300); // paused during the ring: wait
      G.heard.add(key); typeCall(C.CALLS[n]);
    };
    setTimeout(tryCall, 1600);
  }
}
let typeTimer = 0;
function typeCall(s) {
  $("msg").hidden = false; const p = $("msgText"); let i = 0; clearInterval(typeTimer);
  typeTimer = setInterval(() => { i += 2; p.textContent = s.slice(0, i); if (i >= s.length) clearInterval(typeTimer); }, 28);
}
$("msgOk").onclick = () => { clearInterval(typeTimer); $("msg").hidden = true; };

function act(what) {
  const S = G.S;
  if (G.mode !== "play" || !S || S.out || S.over) return;
  audio();
  if (what === "cams") { S.cams = !S.cams; if (S.cams) S.lightL = S.lightR = S.winLight = false; SFX.cam(); syncControls(); return; }
  if (S.cams) { S.cams = false; SFX.cam(); } // an office key while the tablet is up drops it first
  if (what === "doorL" || what === "doorR" || what === "hatch") { S[what] = !S[what]; SFX.door(); }
  if (what === "lightL") { S.lightL = !S.lightL; S.lightR = false; SFX.click(); }
  if (what === "lightR") { S.lightR = !S.lightR; S.lightL = false; SFX.click(); }
  if (what === "winLight") { S.winLight = !S.winLight; SFX.click(); }
  if (what === "lamp") { S.lamp = !S.lamp; SFX.projector(S.lamp); }
  if (what === "feed") { SFX.toss(); feed(S); }
  if (what.startsWith("hue")) { SFX.click(); paint(S, +what[3]); }
  syncControls();
}
function pickCam(n) { const S = G.S; if (G.mode !== "play" || !S || !S.cams) return; S.cam = n; SFX.cam(); syncControls(); }
function syncControls() {
  const S = G.S; if (!S) return;
  const mine = new Map(CH[S.ch].CTL);
  for (const id of ALL_CTL) {
    const b = $(id), k = mine.get(id);
    b.classList.toggle("on", !!(k && S[k])); b.hidden = S.cams || !mine.has(id); b.disabled = !!S.out;
  }
  $("bCam").innerHTML = S.cams ? "▼ PUT THE TABLET DOWN <small>Space</small>" : "▲ CAMERAS <small>Space</small>";
  $("bCam").disabled = !!S.out;
  $("camMap").hidden = !S.cams;
  for (const b of $("camMap").querySelectorAll("button")) b.classList.toggle("on", +b.dataset.cam === S.cam);
}
// camera map buttons (labels are set per chapter in startNight)
(() => {
  const m = $("camMap");
  for (const [n, [x, y]] of Object.entries(CAM_POS)) {
    const b = document.createElement("button"); b.dataset.cam = n; b.textContent = `${n} ${CAM_NAMES[n]}`;
    b.style.left = x + "px"; b.style.top = y + "px"; b.onclick = () => pickCam(+n); m.appendChild(b);

for (const [id, w] of [["bDoorL", "doorL"], ["bDoorR", "doorR"], ["bLightL", "lightL"], ["bLightR", "lightR"], ["bWin", "winLight"], ["bVent", "hatch"], ["bCam", "cams"], ["bFeed", "feed"], ["bLamp", "lamp"], ["bHue0", "hue0"], ["bHue1", "hue1"], ["bHue2", "hue2"]]) $(id).onclick = () => act(w);
addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Escape" || e.code === "KeyP") { if (G.mode === "play") pause(); else if (G.mode === "pause") resume(); return; }
  if (G.mode !== "play" || !G.S) return;
  const k = CH[G.S.ch].KEYS[e.code];
  if (k) { e.preventDefault(); act(k); }
  const d = /^Digit([1-9])$/.exec(e.code); if (d) pickCam(+d[1]);
});
function pause() { G.mode = "pause"; show(["hud", "pause"]); if (AC) AC.suspend(); }
function resume() { G.mode = "play"; show(["hud"]); if (AC) AC.resume(); }
$("bPause").onclick = pause; $("pRes").onclick = resume; $("pQuit").onclick = () => { if (AC) AC.resume(); toTitle(); };

function renderCards() {
  const box = $("cards"), C = CH[G.ch]; box.innerHTML = "";
  C.WHO.forEach((w, i) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<canvas width="220" height="180"></canvas><div class="nm">${C.NAMES[w]}</div><div class="row"><button data-d="-1" aria-label="Less">−</button><div class="lv">${G.customAI[i]}</div><button data-d="1" aria-label="More">+</button></div>`;
    for (const b of c.querySelectorAll("button")) b.onclick = () => { G.customAI[i] = Math.max(0, Math.min(20, G.customAI[i] + +b.dataset.d)); renderCards(); };
    box.appendChild(c);
    // draw the portrait with the shared head painters
    const pc = c.querySelector("canvas").getContext("2d"), main = ctx;
    pc.fillStyle = "#120a22"; pc.fillRect(0, 0, 220, 180);
    ctx = pc; head(w, 110, w === "gulp" ? 92 : 100, w === "gulp" ? 0.72 : 0.85, { t: 0, col: 1 }); ctx = main;
  });
}

// ---- events from the rules → sound and captions
function handleEvents(S) {
  for (const e of S.events) {
    switch (e) {
      case "step": SFX.steps(-0.7, 0.08); break;
      case "step-near": SFX.steps(-0.85, 0.25); caption("🔊 Footsteps… on the left"); break;
      case "bop-leave": SFX.steps(-0.85, 0.25, 4, true); caption("🔊 Footsteps walking away"); break;
      case "pip-move": SFX.tinkle(0.025); break;
      case "pip-window": SFX.creak(); SFX.tinkle(0.07); caption("🎵 A music-box tinkle… by the window"); break;
      case "pip-leave": hiss(0.8, { f: 900, type: "bandpass", vol: 0.12 }); caption("Pippa skated away"); break;
      case "rattle1": SFX.clank(0.08, -0.4, 2); caption("🔊 clank… (somewhere in the vents)"); break;
      case "rattle2": SFX.clank(0.3, -0.3, 5); caption("🔊 CLANK CLANK! Something's at the vent!"); break;
      case "rat-leave": SFX.clank(0.12, -0.4, 4); caption("🔊 Clattering away down the vents"); break;
      case "zoom2": SFX.giggle(); break;
      case "zoom-run": SFX.skates(zoomRun(S.ai[3])); caption("🔊 Skates racing down the East Hall!", 2000); break;
      case "bang": SFX.bang(); caption("BANG BANG BANG! (that cost some power)"); break;
      case "gulp1": case "gulp2": SFX.waddle(0.04 + 0.04 * (e === "gulp2")); if (e === "gulp2") caption("🔊 Flap… flap… (somebody's on the Aisle)"); break;
      case "gulp3": SFX.chomp(0.3); caption("🔊 CHOMP CHOMP! Something's at the popcorn chute!"); break;
      case "gulp-leave": SFX.waddle(0.08); caption("Gulp chased the popcorn all the way back"); break;
      case "popcorn-waste": caption("The popcorn rolled away. Nobody was there. (that cost some power)"); break;
      case "hue-move": SFX.shimmer(0.03); break;
      case "hue-window": SFX.shimmer(0.12); caption("✨ A shimmer… by the window"); break;
      case "hue-leave": SFX.shimmer(0.08, true); caption("Hue crept away"); break;
      case "hue-wrong": SFX.wrong(); caption("Wrong color! Hue's coming closer!"); break;
      case "lumi-move": SFX.flutter(0.04); break;
      case "lumi-lamp": SFX.flutter(0.2); caption("🔊 Flutter flutter… something's at your projector!"); break;
      case "lumi-leave": SFX.flutter(0.08); caption("Lumi fluttered back up to the rafters"); break;
      case "glitch": hiss(0.5, { f: 3000, type: "highpass", vol: 0.15 }); break;
      case "powerout": $("msg").hidden = true; SFX.powerDown(); caption("The power's out…", 3000); syncControls(); break;
      case "scare": break;
      case "6am": break;
    }
  }
  S.events.length = 0;
}

function finishNight() {
  const S = G.S, P = prog(), C = CH[S.ch];
  if (G.custom) {
    if (S.ai.some(a => a > 0)) P.custom = true; if (S.ai.every(a => a >= 20)) P.max = true; storeSave();
    $("wonT").textContent = "6 AM! Custom Night beaten!";
    $("wonP").textContent = C.WHO.map((w, i) => `${C.NAMES[w]} ${S.ai[i]}`).join(" · ") + (S.ai.every(a => a >= 20) ? " — ALL 20s! You're a legend." : "");
    $("wNext").hidden = true;
  } else if (S.night >= 5) {
    P.beat = true; P.night = 5; storeSave();
    $("wonT").textContent = "You survived the whole week!";
    $("wonP").textContent = C.week;
    $("wNext").hidden = true;
  } else {
    P.night = Math.max(P.night, S.night + 1); storeSave();
    $("wonT").textContent = `Night ${S.night} complete!`;
    $("wonP").textContent = S.night === 4 ? "One more night to go." : `On to Night ${S.night + 1}.`;
    $("wNext").hidden = false; $("wNext").textContent = `Night ${S.night + 1}`;
  }
  G.mode = "won"; show(["won"]);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; G.T += dt;
  const T = G.T, S = G.S;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.mode === "play" && S) {
    const k = $("msg").hidden ? dt * G.speed : 0; // the old guard's call holds the clock
    for (let left = k; left > 0; left -= 0.05) step(S, Math.min(0.05, left), G.rnd);
    handleEvents(S);
    if (S.over) { G.mode = "scare"; G.scareT = 0; $("msg").hidden = true; show([]); SFX.scare(save.soft); }
    else if (S.won) { G.mode = "dawn"; G.dawnT = 0; show([]); SFX.chime(); }
  }
  if (S && (G.mode === "play" || G.mode === "pause")) {
    const ease = (a, b) => a + (b - a) * Math.min(1, dt * 12);
    anim.doorL = ease(anim.doorL, S.doorL ? 1 : 0); anim.doorR = ease(anim.doorR, S.doorR ? 1 : 0); anim.hatch = ease(anim.hatch, S.hatch ? 1 : 0);
    if (G.mode === "play") { anim.fan += dt * 14 * (S.out ? 0 : 1); anim.reel += dt * 5 * (S.lamp && !S.out ? 1 : 0); }
    if (amb.buzz) amb.buzz.gain.value = (S.lightL || S.lightR || S.winLight) ? 0.012 : 0;
    if (amb.hum) amb.hum.gain.value = S.out ? 0 : 0.035;
    if (amb.fan) amb.fan.gain.value = S.out ? 0 : 0.025;
    if (S.cams) drawCams(S, T);
    else {
      (S.ch === 2 ? drawOffice2 : drawOffice)(S, T, !!S.out);
      if (S.out) {
        ctx.save(); ctx.globalAlpha = 0.92; rect(0, 0, 1600, 900, "#000"); ctx.restore();
        if (S.out.t > 2.5 && Math.sin(T * 7) > -0.2) head("power", 150, 360, 0.9, { only: true, glow: true });
        if (S.out.t > 2.5 && G.mode === "play") musicBox(T);
      }
      if (S.ch === 1 && S.rat.i === 2 && !S.out && G.mode === "play" && T > G.nextClank) { SFX.clank(0.14, -0.3, 2); G.nextClank = T + 0.9; }
      if (S.ch === 2 && !S.out && G.mode === "play" && T > G.nextClank && (S.gulp.i === 3 || S.lumi.i === 2)) {
        if (S.gulp.i === 3) SFX.chomp(0.16); if (S.lumi.i === 2) SFX.flutter(0.1); G.nextClank = T + 0.8;
      }
    }
    drawHUD(S);
    G.introT += dt;
    if (G.introT < 3) { ctx.save(); ctx.globalAlpha = Math.min(1, 3 - G.introT); rect(0, 330, 1600, 200, "rgba(0,0,0,.6)"); text("12 AM", 800, 400, 90, "#fff"); text(G.custom ? "Custom Night" : `Night ${S.night}`, 800, 480, 40, "#d8c8ff"); ctx.restore(); }
  } else if (G.mode === "scare" && S) {
    G.scareT += dt;
    const soft = save.soft, who = S.over;
    rect(0, 0, 1600, 900, "#000");
    if (soft && G.scareT < 0.6) { text("!", 800, 450, 300, "#ff3b3b"); }
    else {
      const t = soft ? G.scareT - 0.6 : G.scareT, sh = soft ? 0 : 26 * Math.max(0, 1 - t);
      ctx.save(); ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
      const sz = (soft ? 2.6 : 5.6) * Math.min(1, t / 0.18 + 0.2);
      if (!soft) { const rg = ctx.createRadialGradient(800, 450, 100, 800, 450, 900); rg.addColorStop(0, "#3a0000"); rg.addColorStop(1, "#000"); rect(0, 0, 1600, 900, rg); }
      head(who, 800, who === "gulp" ? 420 : 470, sz, { open: Math.min(1, t * 3), glow: true, scary: !soft, t: T, col: S.hue.col });
      ctx.restore();
      if (!soft && t < 0.12) { ctx.save(); ctx.globalAlpha = 0.5; rect(0, 0, 1600, 900, "#fff"); ctx.restore(); }
    }
    if (G.scareT > (soft ? 2 : 1.5)) {
      G.mode = "over"; show(["over"]);
      $("overT").textContent = `${CH[S.ch].NAMES[who]} got you!`;
      $("overWhen").textContent = `${clockLabel(S.t)}, ${G.custom ? "Custom Night" : "Night " + S.night}`;
      $("overTip").textContent = "Tip: " + CH[S.ch].TIPS[who];
      if (amb.buzz) amb.buzz.gain.value = 0;
    }
  } else if (G.mode === "over" && S) {
    rect(0, 0, 1600, 900, "#000"); ctx.save(); ctx.globalAlpha = 0.25; ctx.drawImage(NOISE[Math.floor(T * 20) % 3], 0, 0, 1600, 900); ctx.restore();
  } else if (G.mode === "dawn" && S) {
    G.dawnT += dt;
    rect(0, 0, 1600, 900, "#000");
    const k = Math.min(1, G.dawnT / 1.2);
    text(k < 1 ? "5 AM" : "6 AM", 800, 420, 160, "#fff");
    if (k >= 1) { ctx.save(); ctx.globalAlpha = Math.min(1, G.dawnT - 1.2); text(CH[S.ch].dawn, 800, 560, 36, "#ffe066"); ctx.restore(); }
    if (amb.buzz) amb.buzz.gain.value = 0;
    if (G.dawnT > 3.6) finishNight();
  } else if (G.mode === "won") {
    rect(0, 0, 1600, 900, "#0b0618");
  } else (G.ch === 2 ? drawTitle2 : drawTitle)(T);
  requestAnimationFrame(frame);
}

// fit the 1600×900 stage to the window
function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900), st = $("stage");
  st.style.transform = `translate(${(innerWidth - 1600 * s) / 2}px, ${(innerHeight - 900 * s) / 2}px) scale(${s})`;
